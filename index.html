<!DOCTYPE html>
<!--
  lang="es" (antes decía "en"): TODO el contenido de la app está en español. Con
  lang="en" el navegador cree que la página está en inglés y, para un usuario con
  Chrome/Edge en español, ofrece (o aplica automáticamente, si alguna vez se tildó
  "Traducir siempre inglés al español") traducirla.

  Eso NO es cosmético: el traductor reescribe el DOM por fuera de React —
  reemplaza y fusiona nodos de texto envolviéndolos en <font>. Después, cuando
  React inserta un elemento hermano (p. ej. el chip "OS: ..." del header al elegir
  una obra social), el nodo de referencia que React tenía guardado ya no es hijo
  del contenedor, y el commit revienta con:
    NotFoundError: Failed to execute 'insertBefore' on 'Node': The node before
    which the new node is to be inserted is not a child of this node.
  → pantalla en blanco, sólo en las máquinas donde la traducción está activa.

  translate="no" + <meta name="google" content="notranslate"> son la defensa dura:
  aunque el idioma quedara mal declarado, el traductor no toca esta página. Es un
  panel de gestión interno en español, así que no se pierde nada.
-->
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- El primer pedido al API paga el cifrado completo (0,2 a 0,8 s): se abre la conexión mientras carga el JS. Vite reemplaza la variable al compilar. -->
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <!-- Fuentes propias (public/fonts, @font-face en src/fuentes.css): se precarga la del texto y la de los títulos de cada app. -->
    <script>
      (function () {
        var panel = location.pathname.indexOf("/panel") === 0;
        var fuentes = panel ? ["google-sans", "montserrat"] : ["inter", "manrope"];
        fuentes.forEach(function (f) {
          var l = document.createElement("link");
          l.rel = "preload"; l.as = "font"; l.type = "font/woff2"; l.crossOrigin = "anonymous";
          l.href = "/fonts/" + f + "-latin.woff2";
          document.head.appendChild(l);
        });
      })();
    </script>
    <title>Colegio Médico de Corrientes</title>
    <meta
      name="description"
      content="Colegio Médico de Corrientes: servicios, convenios con obras sociales, beneficios y novedades para los médicos de la provincia."
    />
    <meta name="theme-color" content="#173f70" />
    <!-- Vista previa al compartir un enlace (WhatsApp, Facebook, etc.). Esos
         servicios no ejecutan JavaScript, así que leen estas etiquetas tal cual
         y son las mismas para todas las páginas del sitio. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Colegio Médico de Corrientes" />
    <meta property="og:title" content="Colegio Médico de Corrientes" />
    <meta
      property="og:description"
      content="Servicios, convenios con obras sociales, beneficios y novedades para los médicos de la provincia."
    />
    <meta property="og:url" content="https://colegiomedicocorrientes.com/" />
    <meta property="og:image" content="https://colegiomedicocorrientes.com/logoCMC.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
